cd <div class="crud-admin-layout" [class.sidebar-collapsed]="isSidebarToggled">
  
  <!-- Header del CRUD -->
  <header class="crud-header">
    <div class="header-left">
      <button class="sidebar-toggle-btn" (click)="toggleSidebar()" type="button">
        <i class="fas fa-bars"></i>
      </button>
      <h1 class="crud-title">PixelPlay Admin</h1>
    </div>
    
    <div class="header-center">
      <div class="search-container">
        <input 
          type="text" 
          [(ngModel)]="searchQuery"
          (keyup.enter)="onSearch()"
          placeholder="Buscar en el sistema..." 
          class="search-input" 
        />
        <button type="button" class="search-btn" (click)="onSearch()">
          <i class="fas fa-search"></i>
        </button>
      </div>
    </div>

    <div class="header-right">
      <div class="user-menu">
        <button 
          class="user-btn" 
          [class.dropdown-active]="isUserDropdownVisible"
          type="button" 
          (click)="toggleUserDropdown()">
          <i class="fas fa-user"></i>
        </button>
        <div class="user-dropdown" [class.show]="isUserDropdownVisible">
          <a href="#" class="dropdown-item" (click)="closeDropdown(); $event.preventDefault()">
            <i class="fas fa-cog"></i>
            <span>Configuración</span>
          </a>
          <a href="#" class="dropdown-item" (click)="closeDropdown(); $event.preventDefault()">
            <i class="fas fa-history"></i>
            <span>Registro de actividad</span>
          </a>
          <hr class="dropdown-divider" />
          <a routerLink="/home" class="dropdown-item" (click)="closeDropdown()">
            <i class="fas fa-store"></i>
            <span>Volver a la tienda</span>
          </a>
          <a href="#" class="dropdown-item logout" (click)="logout(); $event.preventDefault()">
            <i class="fas fa-sign-out-alt"></i>
            <span>Cerrar sesión</span>
          </a>
        </div>
      </div>
    </div>
  </header>

  <!-- Sidebar del CRUD -->
  <aside class="crud-sidebar">
    <div class="sidebar-content">
      <nav class="sidebar-nav">
        
        <div class="nav-section">
          <h3 class="nav-section-title">Principal</h3>
          <a class="nav-link" routerLink="/admin/dashboard" routerLinkActive="active" data-tooltip="Dashboard">
            <i class="fas fa-tachometer-alt"></i>
            <span class="nav-text">Dashboard</span>
          </a>
        </div>

        <div class="nav-section">
          <h3 class="nav-section-title">Gestión</h3>
          <a class="nav-link" routerLink="/admin/charts" routerLinkActive="active" data-tooltip="Métricas">
            <i class="fas fa-chart-area"></i>
            <span class="nav-text">Métricas</span>
          </a>
          <a class="nav-link" routerLink="/admin/usuarios" routerLinkActive="active" data-tooltip="Usuarios">
            <i class="fas fa-users"></i>
            <span class="nav-text">Usuarios</span>
          </a>
          <a class="nav-link" routerLink="/admin/productos" routerLinkActive="active" data-tooltip="Productos">
            <i class="fas fa-box"></i>
            <span class="nav-text">Productos</span>
          </a>
          <a class="nav-link" routerLink="/admin/pedidos" routerLinkActive="active" data-tooltip="Pedidos">
            <i class="fas fa-shopping-cart"></i>
            <span class="nav-text">Pedidos</span>
          </a>
        </div>

        <div class="nav-section">
          <h3 class="nav-section-title">Tienda</h3>
          <a class="nav-link" routerLink="/categorias" data-tooltip="Ver Tienda">
            <i class="fas fa-store"></i>
            <span class="nav-text">Ver Tienda</span>
          </a>
          <a class="nav-link" routerLink="/home" data-tooltip="Página Principal">
            <i class="fas fa-home"></i>
            <span class="nav-text">Página Principal</span>
          </a>
        </div>
        
      </nav>
    </div>
    
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar">
          <i class="fas fa-user-shield"></i>
        </div>
        <div class="user-details">
          <div class="user-name">Admin</div>
          <div class="user-role">Administrador</div>
        </div>
        <div class="status-indicator"></div>
      </div>
    </div>
  </aside>

  <!-- Contenido principal del CRUD -->
  <main class="crud-main">
    <div class="content-wrapper">
      <router-outlet></router-outlet>
    </div>
  </main>

</div>
