<body>
    <div class="wrapper"> 
        <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
            <h1>Regístrate</h1> 
            
            <!-- NOMBRE -->
            <div class="input-box">
                <input 
                    type="text" 
                    name="nombre"
                    [(ngModel)]="registerData.nombre"
                    placeholder="Nombre" 
                    required
                    [disabled]="isLoading"
                >
            </div>
            
            <!-- APELLIDO -->
            <div class="input-box">
                <input 
                    type="text" 
                    name="apellido"
                    [(ngModel)]="registerData.apellido"
                    placeholder="Apellido" 
                    required
                    [disabled]="isLoading"
                >
            </div>
            
            <!-- TELÉFONO -->
            <div class="input-box">
                <input 
                    type="tel" 
                    name="telefono"
                    [(ngModel)]="registerData.telefono"
                    placeholder="Número de celular"
                    [disabled]="isLoading"
                >
            </div>
            
            <!-- DIRECCIÓN (OPCIONAL) -->
            <div class="input-box">
                <input 
                    type="text" 
                    name="direccion"
                    [(ngModel)]="registerData.direccion"
                    placeholder="Dirección (opcional)"
                    [disabled]="isLoading"
                >
            </div>
            
            <!-- CORREO -->
            <div class="input-box">
                <input 
                    type="email" 
                    name="correo"
                    [(ngModel)]="registerData.correo"
                    placeholder="Correo" 
                    required
                    email
                    [disabled]="isLoading"
                >
            </div>
            
            <!-- CONTRASEÑA -->
            <div class="input-box">
                <input 
                    type="password" 
                    name="password"
                    [(ngModel)]="registerData.password"
                    placeholder="Contraseña" 
                    required
                    minlength="6"
                    [disabled]="isLoading"
                >
            </div>
            
            <!-- CONFIRMAR CONTRASEÑA -->
            <div class="input-box">
                <input 
                    type="password" 
                    name="confirmPassword"
                    [(ngModel)]="confirmPassword"
                    placeholder="Repita su Contraseña" 
                    required
                    minlength="6"
                    [disabled]="isLoading"
                >
            </div>
            
            <!-- MENSAJE DE ERROR -->
            @if (errorMessage) {
                <div class="error-message">
                    {{ errorMessage }}
                </div>
            }
            
            <!-- BOTÓN -->
            <button 
                type="submit" 
                class="btn"
                [disabled]="!registerForm.valid || isLoading"
            >
                @if (isLoading) {
                    <span>Registrando...</span>
                } @else {
                    <span>Registrarse</span>
                }
            </button>
            
            <!-- LINK A LOGIN -->
            <div class="login-link">
                <p>¿Ya tienes cuenta? <a routerLink="/login">Inicia Sesión</a></p>
            </div>
        </form>
    </div>
</body>
