<body>
  <div class="container-top">
    <p>"Seguridad y confianza, el mejor power-up para tus compras."</p>
  </div>

  <div class="main">
    <img src="/Fondo.png" alt="Imagen de fondo" class="background-image">
    <div class="overlay-black"></div>

    <div class="overlay-content">
      <h2>Recuperar Contraseña</h2>

      <div class="password-group">
        <input 
          type="password" 
          [(ngModel)]="nuevaPassword"
          placeholder="Nueva contraseña"
          [disabled]="loading"
        >
        <input 
          type="password" 
          [(ngModel)]="confirmarPassword"
          placeholder="Confirmar contraseña"
          (keyup.enter)="guardarPassword()"
          [disabled]="loading"
        >
      </div>

      <a (click)="guardarPassword()" class="btn-link" [class.disabled]="loading">
        {{ loading ? 'Guardando...' : 'Guardar' }}
      </a>

      <p class="mensaje" [style.color]="mensajeColor">{{ mensaje }}</p>
    </div>
  </div>

  <div class="container-bottom">
    <p>"Donde tus datos están tan protegidos como tu progreso."</p>
  </div>
</body>
