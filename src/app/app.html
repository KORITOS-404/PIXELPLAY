<!-- Mostrar navbar SOLO si NO estamos en rutas /admin -->
<ng-container *ngIf="!isAdminRoute()">
  <app-navbar></app-navbar>
</ng-container>

<!-- Main container SOLO para rutas normales -->
<main [class.container]="!isAdminRoute()">
  <router-outlet></router-outlet>
</main>

<!-- Mostrar footer SOLO si NO estamos en rutas /admin -->
<ng-container *ngIf="!isAdminRoute()">
  <app-footer></app-footer>
</ng-container>
