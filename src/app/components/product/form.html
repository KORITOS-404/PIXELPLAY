<!-- src/app/components/product/form.html -->
<div class="p-4 max-w-lg">
  <h2 class="text-lg font-bold mb-3">{{ id() ? 'Editar producto' : 'Nuevo producto' }}</h2>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>Nombre</label>
    <input formControlName="nombre" />
    <div *ngIf="form.controls.nombre.invalid && form.controls.nombre.touched">Nombre requerido</div>

    <label>Descripción</label>
    <textarea formControlName="descripcion"></textarea>

    <label>Precio</label>
    <input type="number" formControlName="precio" />

    <label>Stock</label>
    <input type="number" formControlName="stock" />

    <div class="mt-4">
      <button type="submit">{{ id() ? 'Actualizar' : 'Guardar' }}</button>
      <button type="button" (click)="cancelar()">Cancelar</button>
    </div>
  </form>
</div>
