<section class="container mx-auto max-w-5xl mt-10 p-6 bg-white shadow rounded-xl">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-semibold">Listado de Productos</h2>
    <button
      routerLink="/productos/nuevo"
      class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded transition"
    >
      + Nuevo Producto
    </button>
  </div>

  @if (cargando()) {
    <p class="text-gray-500">Cargando productos...</p>
  } @else {
    <table class="w-full border-collapse text-sm">
      <thead class="bg-gray-100 border-b">
        <tr>
          <th class="text-left py-2 px-3">ID</th>
          <th class="text-left py-2 px-3">Nombre</th>
          <th class="text-left py-2 px-3">Descripción</th>
          <th class="text-left py-2 px-3">Precio</th>
          <th class="text-left py-2 px-3">Stock</th>
          <th class="text-center py-2 px-3">Acciones</th>
        </tr>
      </thead>

      <tbody>
        @for (p of productos(); track p.id) {
          <tr class="border-b hover:bg-gray-50">
            <td class="py-2 px-3">{{ p.id }}</td>
            <td class="py-2 px-3">{{ p.nombre }}</td>
            <td class="py-2 px-3">{{ p.descripcion }}</td>
            <td class="py-2 px-3">{{ p.precio | currency:'USD' }}</td>
            <td class="py-2 px-3">{{ p.stock }}</td>
            <td class="py-2 px-3 text-center">
              <button
                [routerLink]="['/productos/editar', p.id]"
                class="bg-yellow-400 hover:bg-yellow-500 text-white px-3 py-1 rounded mr-2 transition"
              >
                Editar
              </button>
              <button
                (click)="eliminar(p.id)"
                class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded transition"
              >
                Eliminar
              </button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="6" class="text-center text-gray-500 py-4">
              No hay productos registrados.
            </td>
          </tr>
        }
      </tbody>
    </table>
  }
</section>
